<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Diagrams Workspace Fragment -->
<div th:fragment="diagram-markup">
    <div class="workspace-content-pane" id="diagramsPane" style="display: none;">
        <div class="detail-card-list">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px;">
                <h3 style="margin:0; font-size: 1.1rem;"><i class="fa-solid fa-diagram-project"></i> 다이어그램 산출물 목록</h3>
                <button class="btn-primary" onclick="openDiagramModal()"><i class="fa-solid fa-plus"></i> 다이어그램 추가</button>
            </div>
            
            <!-- Filters & Sorting for Diagrams -->
            <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;">
                <input type="text" id="diagramSearchInput" class="filter-select" oninput="filterAndRenderDiagrams()" placeholder="다이어그램 제목 검색..." style="width: 200px; padding: 6px 12px; font-size: 0.9rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-primary);">
                
                <select id="diagramFilterRequirement" class="filter-select" onchange="filterAndRenderDiagrams()" style="width: 180px;">
                    <option value="">모든 요구사항</option>
                </select>

                <select id="diagramFilterTask" class="filter-select" onchange="filterAndRenderDiagrams()" style="width: 150px;">
                    <option value="">연관 작업 전체</option>
                    <option value="HAS_TASK">연관 작업 있음</option>
                    <option value="NO_TASK">연관 작업 없음</option>
                </select>

                <select id="diagramSortOrder" class="filter-select" onchange="filterAndRenderDiagrams()" style="width: 150px; margin-left: auto;">
                    <option value="NEWEST" selected>최신 수정순</option>
                    <option value="OLDEST">오래된 수정순</option>
                    <option value="TITLE_ASC">제목 오름차순</option>
                    <option value="TITLE_DESC">제목 내림차순</option>
                </select>
            </div>

            <!-- Diagrams List Container -->
            <div id="diagramsContainer" style="display: flex; flex-direction: column; gap: 20px;">
                <!-- Dynamic Content Rendered by JS -->
            </div>
            <div class="no-data-msg" id="diagramsPlaceholder" style="display: none;">
                조건에 맞는 다이어그램 산출물이 없습니다.
            </div>
        </div>
    </div>
</div>

<!-- Diagram Modals Fragment -->
<div th:fragment="diagram-modals">
    <!-- Diagram Create/Edit Modal -->
    <div class="modal-overlay" id="diagramModal">
        <div class="modal-content" style="max-width: 900px; width: 90%;">
            <div class="modal-header">
                <h2 id="diagramModalTitleText">다이어그램 산출물 등록</h2>
                <button class="modal-close" onclick="closeDiagramModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="diagramForm">
                <input type="hidden" id="modalDiagramId">
                <div class="form-group-modal">
                    <label for="diagramRequirement">연관 요구사항</label>
                    <select id="diagramRequirement" class="modal-select" required onchange="updateTaskOptionsForRequirement()">
                        <!-- Dynamic options loaded by JS -->
                    </select>
                </div>
                <div class="form-group-modal">
                    <label for="diagramTitle">다이어그램 제목</label>
                    <input type="text" id="diagramTitle" required placeholder="다이어그램 제목을 입력하세요 (예: 회원가입 시퀀스 다이어그램)">
                </div>
                <div class="form-group-modal">
                    <label for="diagramTask">연관 수정 태스크 (선택)</label>
                    <select id="diagramTask" class="modal-select">
                        <option value="">연관 태스크 없음</option>
                        <!-- Dynamic options loaded by JS based on selected requirement -->
                    </select>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px;">
                    <!-- Editor Left -->
                    <div class="form-group-modal">
                        <label for="diagramCode">Mermaid 코드 작성</label>
                        <textarea id="diagramCode" required placeholder="graph TD;&#10;    A[시작] --> B(프로세스);&#10;    B --> C{조건};" rows="12" style="font-family: monospace; font-size: 0.9rem; padding: 12px; line-height: 1.5; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
                    </div>
                    <!-- Live Preview Right -->
                    <div class="form-group-modal">
                        <label>실시간 미리보기 (Live Preview)</label>
                        <div id="diagramPreviewContainer" style="background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; height: 280px; overflow: auto; display: flex; align-items: center; justify-content: center; position: relative;">
                            <div id="diagramPreview" class="mermaid" style="width: 100%; text-align: center;"></div>
                            <div id="previewError" style="display: none; color: #ef4444; font-size: 0.85rem; font-family: monospace; white-space: pre-wrap; width: 100%; height: 100%; overflow: auto; box-sizing: border-box; text-align: left; padding: 8px;"></div>
                        </div>
                    </div>
                </div>

                <div class="modal-actions" style="margin-top: 20px;">
                    <button type="button" class="btn-secondary" onclick="closeDiagramModal()">취소</button>
                    <button type="submit" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Diagram Scripts Fragment -->
<th:block th:fragment="diagram-scripts">
    <!-- Mermaid.js for Dynamic Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script>
        // Initialize Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: document.documentElement.getAttribute('data-theme') === 'light' ? 'default' : 'dark',
            securityLevel: 'loose'
        });

        // Listen for Theme Change to dynamically update Mermaid theme
        const observer = new MutationObserver(() => {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'default' : 'dark';
            mermaid.initialize({
                theme: currentTheme
            });
            if (activeTab === 'diagrams') {
                renderDiagrams();
            }
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        /* --- Mermaid Diagrams CRUD Scripts --- */
        let previewTimeout = null;
        let loadedDiagrams = {};
        let renderedDiagrams = {};
        let projectDiagramsList = [];

        async function renderDiagrams() {
            loadedDiagrams = {};
            renderedDiagrams = {};
            projectDiagramsList = [];

            const container = document.getElementById('diagramsContainer');
            const placeholder = document.getElementById('diagramsPlaceholder');
            container.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 20px;">다이어그램 목록 로딩 중...</div>';
            placeholder.style.display = 'none';

            // 필터 드롭다운 옵션 초기화
            populateDiagramFilters();

            if (!projectRequirements || projectRequirements.length === 0) {
                container.innerHTML = '';
                placeholder.style.display = 'block';
                return;
            }

            try {
                // 각 요구사항별로 다이어그램 병렬 페치
                const fetchPromises = projectRequirements.map(async (req) => {
                    try {
                        const res = await fetch(`/api/requirements/${req.id}/diagrams`);
                        if (res.ok) {
                            const list = await res.json();
                            return list.map(d => ({
                                ...d,
                                requirementCode: req.requirementCode,
                                requirementTitle: req.title,
                                requirementId: req.id
                            }));
                        }
                    } catch (e) {
                        console.error(e);
                    }
                    return [];
                });

                const results = await Promise.all(fetchPromises);
                projectDiagramsList = results.flat();

                // 메모리 캐싱
                projectDiagramsList.forEach(d => {
                    loadedDiagrams[d.id] = d;
                });

                // 필터 적용 후 렌더링
                filterAndRenderDiagrams();
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-error); text-align: center; padding: 20px;">다이어그램 로딩에 실패했습니다.</div>';
            }
        }

        function populateDiagramFilters() {
            const reqFilter = document.getElementById('diagramFilterRequirement');
            if (!reqFilter) return;

            const selectedVal = reqFilter.value;
            reqFilter.innerHTML = '<option value="">모든 요구사항</option>' +
                projectRequirements.map(r => `<option value="${r.id}">${escapeHtml(r.requirementCode)} - ${escapeHtml(r.title)}</option>`).join('');
            
            if (projectRequirements.some(r => r.id == selectedVal)) {
                reqFilter.value = selectedVal;
            } else {
                reqFilter.value = '';
            }
        }

        function filterAndRenderDiagrams() {
            const container = document.getElementById('diagramsContainer');
            const placeholder = document.getElementById('diagramsPlaceholder');
            container.innerHTML = '';

            const searchInput = document.getElementById('diagramSearchInput');
            const reqFilter = document.getElementById('diagramFilterRequirement');
            const taskFilter = document.getElementById('diagramFilterTask');
            const sortOrder = document.getElementById('diagramSortOrder');

            const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const reqIdVal = reqFilter ? reqFilter.value : '';
            const taskFilterVal = taskFilter ? taskFilter.value : '';
            const sortVal = sortOrder ? sortOrder.value : 'NEWEST';

            // 1. Filter
            let filtered = projectDiagramsList.filter(diagram => {
                if (query && !diagram.title.toLowerCase().includes(query)) return false;
                if (reqIdVal && diagram.requirementId != reqIdVal) return false;
                if (taskFilterVal === 'HAS_TASK' && !diagram.lastModifiedByTaskId) return false;
                if (taskFilterVal === 'NO_TASK' && diagram.lastModifiedByTaskId) return false;
                return true;
            });

            // 2. Sort
            filtered.sort((a, b) => {
                if (sortVal === 'NEWEST') {
                    return new Date(b.updatedAt) - new Date(a.updatedAt);
                } else if (sortVal === 'OLDEST') {
                    return new Date(a.updatedAt) - new Date(b.updatedAt);
                } else if (sortVal === 'TITLE_ASC') {
                    return a.title.localeCompare(b.title);
                } else if (sortVal === 'TITLE_DESC') {
                    return b.title.localeCompare(a.title);
                }
                return 0;
            });

            // 3. Render
            if (filtered.length === 0) {
                placeholder.style.display = 'block';
                return;
            }
            placeholder.style.display = 'none';

            filtered.forEach(diagram => {
                const card = document.createElement('div');
                card.className = 'diagram-card';
                card.style.cssText = 'border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px;';

                let lastModifiedTaskHtml = '';
                if (diagram.lastModifiedByTaskId) {
                    lastModifiedTaskHtml = `
                        <span style="font-size: 0.75rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color);">
                            <i class="fa-solid fa-tasks" style="margin-right: 4px;"></i>연관 작업: ${escapeHtml(diagram.lastModifiedByTaskTitle)}
                        </span>
                    `;
                }

                const updatedDate = new Date(diagram.updatedAt).toLocaleString('ko-KR', { hour12: false });

                card.innerHTML = `
                    <div class="diagram-card-header" onclick="toggleDiagramDetails(${diagram.id})" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                            <i class="fa-solid fa-chevron-right toggle-icon" id="diagramToggleIcon-${diagram.id}" style="transition: transform 0.2s;"></i>
                            <span class="req-code" style="font-size:0.75rem; background: rgba(100, 100, 100, 0.1); padding: 2px 6px; border-radius: 4px;">${escapeHtml(diagram.requirementCode)}</span>
                            <h5 style="margin:0; font-size: 0.95rem; color: var(--text-primary);">${escapeHtml(diagram.title)}</h5>
                            ${lastModifiedTaskHtml}
                            <span style="font-size: 0.75rem; color: var(--text-muted);"><i class="fa-regular fa-clock" style="margin-right: 4px;"></i>수정일시: ${updatedDate}</span>
                        </div>
                        <div style="display: flex; gap: 6px;" onclick="event.stopPropagation();">
                            <button class="btn-task-action" onclick="openDiagramModal(${diagram.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-task-action" onclick="deleteDiagram(${diagram.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="diagram-details" id="diagramDetails-${diagram.id}" style="display: none; margin-top: 12px; border-top: 1px dashed var(--border-color); padding-top: 12px;">
                        <div id="diagram-render-area-${diagram.id}" style="display: flex; justify-content: center; overflow: auto; padding: 12px; background: rgba(0,0,0,0.15); border-radius: 6px; min-height: 100px;">
                            <span style="font-size: 0.85rem; color: var(--text-muted);">다이어그램 렌더링 중...</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function toggleDiagramDetails(diagramId) {
            const details = document.getElementById(`diagramDetails-${diagramId}`);
            const icon = document.getElementById(`diagramToggleIcon-${diagramId}`);
            if (!details) return;

            if (details.style.display === 'block') {
                details.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                details.style.display = 'block';
                icon.style.transform = 'rotate(90deg)';
                
                const diagram = loadedDiagrams[diagramId];
                if (diagram && !renderedDiagrams[diagramId]) {
                    await renderDiagramSvg(diagram);
                    renderedDiagrams[diagramId] = true;
                }
            }
        }

        async function renderDiagramSvg(diagram) {
            const renderArea = document.getElementById(`diagram-render-area-${diagram.id}`);
            const id = 'diagram_svg_' + diagram.id;
            try {
                const code = diagram.mermaidCode.trim();
                const { svg } = await mermaid.render(id, code);
                renderArea.innerHTML = svg;
            } catch (err) {
                console.error(err);
                renderArea.innerHTML = `
                    <div style="text-align: left; width: 100%;">
                        <div style="color: #ef4444; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px;"><i class="fa-solid fa-circle-xmark"></i> Mermaid 렌더링 오류</div>
                        <pre style="margin: 0; font-family: monospace; font-size: 0.85rem; color: var(--text-muted); background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px; border-radius: 4px; overflow: auto; white-space: pre-wrap;">${escapeHtml(diagram.mermaidCode)}</pre>
                    </div>
                `;
                // Remove error SVG if generated
                const badSvg = document.getElementById('d' + id);
                if (badSvg) badSvg.remove();
            }
        }

        function updateTaskOptionsForRequirement() {
            const reqSelect = document.getElementById('diagramRequirement');
            const taskSelect = document.getElementById('diagramTask');
            const reqId = reqSelect.value;
            
            taskSelect.innerHTML = '<option value="">연관 태스크 없음</option>';
            if (!reqId) return;
            
            const tasks = projectTasks.filter(t => t.requirement && t.requirement.id == reqId);
            tasks.forEach(t => {
                taskSelect.innerHTML += `<option value="${t.id}">${escapeHtml(t.title)}</option>`;
            });
        }

        async function drawDiagram() {
            const code = document.getElementById('diagramCode').value.trim();
            const previewEl = document.getElementById('diagramPreview');
            const errorEl = document.getElementById('previewError');
            
            if (!code) {
                previewEl.innerHTML = '<span style="color: var(--text-muted);">코드를 입력하면 여기에 렌더링됩니다.</span>';
                errorEl.style.display = 'none';
                return;
            }
            
            const id = 'preview_' + Math.floor(Math.random() * 10000);
            try {
                const { svg } = await mermaid.render(id, code);
                previewEl.innerHTML = svg;
                errorEl.style.display = 'none';
                previewEl.style.display = 'block';
            } catch (err) {
                errorEl.textContent = err.message || '다이어그램 문법 오류가 발생했습니다.';
                errorEl.style.display = 'block';
                previewEl.style.display = 'none';
                
                const badSvg = document.getElementById('d' + id);
                if (badSvg) badSvg.remove();
            }
        }

        document.getElementById('diagramCode').addEventListener('input', () => {
            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(drawDiagram, 400);
        });

        async function openDiagramModal(diagramId = null, defaultReqId = null) {
            const modal = document.getElementById('diagramModal');
            document.getElementById('diagramForm').reset();
            document.getElementById('modalDiagramId').value = '';
            
            // Reset Preview
            document.getElementById('diagramPreview').innerHTML = '<span style="color: var(--text-muted);">코드를 입력하면 여기에 렌더링됩니다.</span>';
            document.getElementById('diagramPreview').style.display = 'block';
            document.getElementById('previewError').style.display = 'none';
            
            // Populate requirements select list
            const reqSelect = document.getElementById('diagramRequirement');
            reqSelect.innerHTML = '<option value="">요구사항을 선택하세요</option>' +
                projectRequirements.map(r => `<option value="${r.id}">${escapeHtml(r.requirementCode)} - ${escapeHtml(r.title)}</option>`).join('');
            
            if (defaultReqId) {
                reqSelect.value = defaultReqId;
                updateTaskOptionsForRequirement();
            }
            
            if (diagramId) {
                document.getElementById('diagramModalTitleText').textContent = '다이어그램 정보 수정';
                try {
                    const res = await fetch(`/api/diagrams/${diagramId}`);
                    if (!res.ok) throw new Error();
                    const diagram = await res.json();
                    
                    document.getElementById('modalDiagramId').value = diagram.id;
                    reqSelect.value = diagram.requirementId;
                    updateTaskOptionsForRequirement();
                    
                    document.getElementById('diagramTitle').value = diagram.title;
                    document.getElementById('diagramCode').value = diagram.mermaidCode;
                    if (diagram.lastModifiedByTaskId) {
                        document.getElementById('diagramTask').value = diagram.lastModifiedByTaskId;
                    }
                    
                    // Trigger Live Preview render
                    drawDiagram();
                } catch (err) {
                    console.error(err);
                    displayToast('다이어그램 정보를 가져오는데 실패했습니다.', 'error');
                    return;
                }
            } else {
                document.getElementById('diagramModalTitleText').textContent = '다이어그램 산출물 등록';
            }
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeDiagramModal() {
            const modal = document.getElementById('diagramModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 250);
        }

        async function deleteDiagram(id) {
            if (!confirm('정말로 이 다이어그램 산출물을 삭제하시겠습니까?')) return;
            try {
                const res = await fetch(`/api/diagrams/${id}`, {
                    method: 'DELETE'
                });
                if (!res.ok) throw new Error();
                displayToast('다이어그램 산출물이 삭제되었습니다.', 'success');
                await reloadWorkspaceData();
                if (activeTab === 'diagrams') {
                    renderDiagrams();
                }
            } catch (err) {
                console.error(err);
                displayToast('다이어그램 삭제에 실패했습니다.', 'error');
            }
        }

        document.getElementById('diagramForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('modalDiagramId').value;
            const reqId = document.getElementById('diagramRequirement').value;
            const title = document.getElementById('diagramTitle').value.trim();
            const mermaidCode = document.getElementById('diagramCode').value.trim();
            const taskIdVal = document.getElementById('diagramTask').value;
            const lastModifiedByTaskId = taskIdVal ? parseInt(taskIdVal, 10) : null;
            const requirementId = reqId ? parseInt(reqId, 10) : null;
            
            const payload = { title, mermaidCode, lastModifiedByTaskId, requirementId };
            
            try {
                let res;
                if (id) {
                    res = await fetch(`/api/diagrams/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    res = await fetch(`/api/requirements/${reqId}/diagrams`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                if (!res.ok) throw new Error();
                displayToast('다이어그램 산출물이 저장되었습니다.', 'success');
                closeDiagramModal();
                await reloadWorkspaceData();
                if (activeTab === 'diagrams') {
                    renderDiagrams();
                }
            } catch (err) {
                console.error(err);
                displayToast('다이어그램 저장에 실패했습니다.', 'error');
            }
        });
    </script>
</th:block>

</body>
</html>
