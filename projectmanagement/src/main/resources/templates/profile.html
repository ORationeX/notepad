<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 설정 | Project Management</title>
    
    <!-- Theme script to prevent flashing -->
    <script th:src="@{/js/theme.js}"></script>
    
    <!-- Google Fonts: Outfit & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        .profile-container {
            max-width: 640px;
            margin: 40px auto;
            padding: 0 24px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .profile-avatar-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
        }
        
        .profile-avatar {
            width: 72px;
            height: 72px;
            background: var(--primary);
            color: var(--primary-text);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .profile-avatar-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .profile-avatar-info span {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--secondary);
            border: 1px solid var(--card-border);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 28px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        input:disabled {
            background: var(--secondary);
            cursor: not-allowed;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Ambient Glow effects -->
    <div class="ambient-light-1"></div>
    <div class="ambient-light-2"></div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Navigation Bar -->
    <div th:replace="~{fragments/nav :: navbar(activePage='profile')}"></div>

    <div class="profile-container">
        <!-- Dashboard Welcome Title -->
        <div class="dashboard-header">
            <h1 class="dashboard-title">프로필 설정</h1>
            <p class="dashboard-subtitle">회원 정보를 조회하고 수정할 수 있습니다.</p>
        </div>

        <div class="card">
            <div class="profile-avatar-row">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <div class="profile-avatar-info">
                    <h3 id="profileHeaderName">Loading...</h3>
                    <span id="profileHeaderRole">USER</span>
                </div>
            </div>

            <!-- Profile Form -->
            <form id="profileForm" novalidate>
                <!-- Email (Read-only) -->
                <div class="form-group" id="emailGroup">
                    <div class="label-row">
                        <label for="email">이메일 계정 (변경 불가)</label>
                    </div>
                    <div class="input-wrapper">
                        <input type="email" id="email" disabled>
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>

                <!-- Nickname -->
                <div class="form-group" id="nicknameGroup">
                    <div class="label-row">
                        <label for="nickname">닉네임</label>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="nickname" placeholder="닉네임 입력" required>
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>
                    <div class="error-message" id="nicknameError">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>닉네임은 필수 입력 항목입니다.</span>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group" id="phoneNumberGroup">
                    <div class="label-row">
                        <label for="phoneNumber">휴대폰 번호</label>
                    </div>
                    <div class="input-wrapper">
                        <input type="tel" id="phoneNumber" placeholder="010-0000-0000" maxlength="13" required>
                        <i class="fa-solid fa-phone input-icon"></i>
                    </div>
                    <div class="error-message" id="phoneNumberError">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>올바른 휴대폰 번호를 입력하세요 (예: 010-1234-5678).</span>
                    </div>
                </div>

                <div class="section-title">비밀번호 변경 (선택사항)</div>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">비밀번호를 변경하려면 아래 필드를 입력하십시오. 변경하지 않으려면 비워 두십시오.</p>

                <!-- New Password -->
                <div class="form-group" id="passwordGroup">
                    <div class="label-row">
                        <label for="password">새 비밀번호</label>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="새 비밀번호 입력 (4~20자)">
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                    <div class="password-rules" id="passwordRules" style="display: flex;">
                        <div class="rule-item invalid" id="ruleLength">
                            <i class="fa-regular fa-circle-xmark"></i>
                            <span>4자 이상 20자 이하</span>
                        </div>
                    </div>
                    <div class="error-message" id="passwordError">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>올바른 비밀번호 형식을 입력하세요.</span>
                    </div>
                </div>

                <!-- Password Confirm -->
                <div class="form-group" id="passwordConfirmGroup">
                    <div class="label-row">
                        <label for="passwordConfirm">새 비밀번호 확인</label>
                        <span class="badge" id="matchBadge">일치</span>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="passwordConfirm" placeholder="새 비밀번호 재입력">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                    </div>
                    <div class="error-message" id="passwordConfirmError">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>새 비밀번호가 일치하지 않습니다.</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span>프로필 수정 저장</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard/Nav common JS logic -->
    <script th:src="@{/js/dashboard.js}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('profileForm');
            const emailInput = document.getElementById('email');
            const nicknameInput = document.getElementById('nickname');
            const phoneInput = document.getElementById('phoneNumber');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('passwordConfirm');
            const submitBtn = document.getElementById('btnSubmit');
            const spinner = document.getElementById('btnSpinner');

            const profileHeaderName = document.getElementById('profileHeaderName');
            const profileHeaderRole = document.getElementById('profileHeaderRole');
            
            const ruleLength = document.getElementById('ruleLength');
            const matchBadge = document.getElementById('matchBadge');

            // Utilities: Show Toast Notification
            function showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icon = type === 'success' 
                    ? '<i class="fa-solid fa-circle-check"></i>' 
                    : '<i class="fa-solid fa-triangle-exclamation"></i>';
                
                toast.innerHTML = `${icon}<span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 4000);
            }

            function showError(input, errorEl, message) {
                errorEl.querySelector('span').textContent = message;
                errorEl.style.display = 'flex';
                input.style.borderColor = 'var(--error)';
                input.style.boxShadow = '0 0 0 3px rgba(244, 63, 94, 0.15)';
            }

            function clearError(input, errorEl) {
                errorEl.style.display = 'none';
                input.style.borderColor = '';
                input.style.boxShadow = '';
            }

            function validatePhone(phone) {
                return /^\d{2,3}-\d{3,4}-\d{4}$/.test(phone);
            }

            // Load user profile details
            async function loadProfile() {
                try {
                    const response = await fetch('/api/members/me', {
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    const result = await response.json();
                    
                    if (response.ok && result.success) {
                        const data = result.data;
                        emailInput.value = data.email;
                        nicknameInput.value = data.nickname;
                        phoneInput.value = data.phoneNumber;
                        
                        profileHeaderName.textContent = data.nickname;
                        profileHeaderRole.textContent = data.role;
                    } else {
                        showToast('프로필 정보를 로드하는 데 실패했습니다.', 'error');
                    }
                } catch (error) {
                    console.error('Fetch profile error:', error);
                    showToast('네트워크 오류로 프로필 정보를 가져오지 못했습니다.', 'error');
                }
            }

            loadProfile();

            // Auto format phone number
            phoneInput.addEventListener('input', (e) => {
                let val = e.target.value.replace(/[^0-9]/g, '');
                if (val.length > 3 && val.length <= 7) {
                    val = val.substring(0, 3) + '-' + val.substring(3);
                } else if (val.length > 7) {
                    val = val.substring(0, 3) + '-' + val.substring(3, 7) + '-' + val.substring(7, 11);
                }
                e.target.value = val;
                
                const err = document.getElementById('phoneNumberError');
                if (val === '' || validatePhone(val)) {
                    clearError(phoneInput, err);
                }
            });

            nicknameInput.addEventListener('input', () => {
                const err = document.getElementById('nicknameError');
                if (nicknameInput.value.trim() !== '') {
                    clearError(nicknameInput, err);
                }
            });

            // Password rules and matching confirmation
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                const err = document.getElementById('passwordError');

                if (val === '') {
                    ruleLength.className = 'rule-item invalid';
                    ruleLength.querySelector('i').className = 'fa-regular fa-circle-xmark';
                    clearError(passwordInput, err);
                    checkPasswordMatch();
                    return;
                }

                if (val.length >= 4 && val.length <= 20) {
                    ruleLength.className = 'rule-item valid';
                    ruleLength.querySelector('i').className = 'fa-solid fa-circle-check';
                    clearError(passwordInput, err);
                } else {
                    ruleLength.className = 'rule-item invalid';
                    ruleLength.querySelector('i').className = 'fa-regular fa-circle-xmark';
                }
                checkPasswordMatch();
            });

            confirmInput.addEventListener('input', checkPasswordMatch);

            function checkPasswordMatch() {
                const pVal = passwordInput.value;
                const cVal = confirmInput.value;
                const err = document.getElementById('passwordConfirmError');

                if (!pVal) {
                    matchBadge.className = 'badge';
                    clearError(confirmInput, err);
                    return;
                }

                if (!cVal) {
                    matchBadge.className = 'badge';
                    clearError(confirmInput, err);
                    return;
                }

                if (pVal === cVal) {
                    matchBadge.textContent = '일치';
                    matchBadge.className = 'badge match';
                    clearError(confirmInput, err);
                } else {
                    matchBadge.textContent = '불일치';
                    matchBadge.className = 'badge no-match';
                }
            }

            // Submit logic
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const nicknameError = document.getElementById('nicknameError');
                const phoneError = document.getElementById('phoneNumberError');
                const passwordError = document.getElementById('passwordError');
                const confirmError = document.getElementById('passwordConfirmError');

                clearError(nicknameInput, nicknameError);
                clearError(phoneInput, phoneError);
                clearError(passwordInput, passwordError);
                clearError(confirmInput, confirmError);

                let hasError = false;

                if (!nicknameInput.value.trim()) {
                    showError(nicknameInput, nicknameError, '닉네임은 필수 입력 항목입니다.');
                    hasError = true;
                }

                if (!phoneInput.value) {
                    showError(phoneInput, phoneError, '휴대폰 번호는 필수 입력 항목입니다.');
                    hasError = true;
                } else if (!validatePhone(phoneInput.value)) {
                    showError(phoneInput, phoneError, '올바른 휴대폰 번호 형식이어야 합니다.');
                    hasError = true;
                }

                const newPw = passwordInput.value;
                if (newPw !== '') {
                    if (newPw.length < 4 || newPw.length > 20) {
                        showError(passwordInput, passwordError, '비밀번호는 4자 이상 20자 이하로 입력해야 합니다.');
                        hasError = true;
                    }
                    if (confirmInput.value !== newPw) {
                        showError(confirmInput, confirmError, '비밀번호가 일치하지 않습니다.');
                        hasError = true;
                    }
                }

                if (hasError) {
                    const inputs = [nicknameInput, phoneInput, passwordInput, confirmInput];
                    inputs.forEach(el => {
                        const errMap = {
                            nickname: nicknameError,
                            phoneNumber: phoneError,
                            password: passwordError,
                            passwordConfirm: confirmError
                        };
                        const err = errMap[el.id];
                        if (err && err.style.display === 'flex') {
                            const grp = el.closest('.form-group');
                            grp.classList.add('shake');
                            setTimeout(() => grp.classList.remove('shake'), 400);
                        }
                    });
                    showToast('입력값을 다시 확인해 주세요.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                spinner.style.display = 'block';

                const updateData = {
                    nickname: nicknameInput.value.trim(),
                    phoneNumber: phoneInput.value,
                    newPassword: newPw !== '' ? newPw : null
                };

                try {
                    const response = await fetch('/api/members/me', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(updateData)
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.success) {
                        profileHeaderName.textContent = result.data.nickname;
                        const navUserEmailEl = document.getElementById('navUserEmail');
                        if (navUserEmailEl) {
                            // Update the nav elements to match the new nickname if shown, or keep email.
                            // The nav currently shows user email. Let's keep it, but reload profile details to keep sync.
                        }
                        
                        passwordInput.value = '';
                        confirmInput.value = '';
                        matchBadge.className = 'badge';
                        ruleLength.className = 'rule-item invalid';
                        ruleLength.querySelector('i').className = 'fa-regular fa-circle-xmark';

                        if (updateData.newPassword) {
                            showToast('비밀번호가 변경되었습니다. 로그아웃 후 다시 로그인해 주세요.', 'success');
                            // Clear token cookie
                            document.cookie = 'token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Strict';
                            setTimeout(() => {
                                window.location.href = '/login';
                            }, 2000);
                        } else {
                            showToast('회원 정보가 성공적으로 수정되었습니다.', 'success');
                            submitBtn.disabled = false;
                            spinner.style.display = 'none';
                            loadProfile(); // reload profile card info
                        }
                    } else {
                        submitBtn.disabled = false;
                        spinner.style.display = 'none';
                        showToast(result.message || '정보 수정에 실패했습니다.', 'error');
                    }
                } catch (error) {
                    console.error('Update profile error:', error);
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    showToast('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'error');
                }
            });
        });
    </script>
</body>
</html>
