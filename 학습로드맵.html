<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1년 학습 로드맵 · 영어 · 알고리즘 · 수학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8e1d2;
    --bg-2: #f7f3ea;
    --ink: #1c1914;
    --muted: #5f584c;
    --line: #d9d0c0;
    --card: #fffdf8;
    --en: #0e5e56;
    --en-soft: #e3f2ef;
    --al: #8d3d16;
    --al-soft: #f8ebe3;
    --ma: #2a3878;
    --ma-soft: #e7e9f6;
    --accent: #1c1914;
    --accent-soft: #efe8d8;
    --good: #1c6b3c;
    --shadow: 0 10px 30px rgba(48, 32, 8, 0.06);
  }
  body[data-track="en"] { --accent: var(--en); --accent-soft: var(--en-soft); }
  body[data-track="al"] { --accent: var(--al); --accent-soft: var(--al-soft); }
  body[data-track="ma"] { --accent: var(--ma); --accent-soft: var(--ma-soft); }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 0% -10%, rgba(255, 250, 240, 0.9), transparent 55%),
      var(--bg);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    word-break: keep-all;
  }
  button, input, summary { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  .top {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 18px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px;
    background: #1c1914;
    color: #f6f1e6;
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    border: 0;
    background: transparent;
    color: inherit;
    padding: 0;
    text-align: left;
  }
  .brand-kicker {
    font-family: Fraunces, "Times New Roman", serif;
    letter-spacing: 0.16em;
    font-size: 11px;
    opacity: 0.72;
  }
  .brand-name { font-weight: 700; letter-spacing: -0.03em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab, .ghost {
    border: 1px solid transparent;
    background: transparent;
    color: inherit;
    border-radius: 999px;
    padding: 6px 12px;
  }
  .tab[aria-current="page"] {
    background: #f6f1e6;
    color: #1c1914;
  }
  .top-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .top-tools label { font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .top-tools input[type="date"] {
    background: transparent;
    color: inherit;
    border: 1px solid rgba(246, 241, 230, 0.35);
    border-radius: 8px;
    padding: 4px 8px;
  }
  .statline { font-size: 13px; opacity: 0.85; }
  .menu { position: relative; }
  .menu summary {
    list-style: none;
    cursor: pointer;
    border: 1px solid rgba(246, 241, 230, 0.35);
    border-radius: 999px;
    padding: 6px 12px;
  }
  .menu summary::-webkit-details-marker { display: none; }
  .menu-panel {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    min-width: 180px;
    box-shadow: var(--shadow);
    padding: 6px;
    z-index: 40;
  }
  .menu-panel button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 8px 10px;
    border-radius: 8px;
  }
  .menu-panel button:hover { background: var(--accent-soft); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }
  .hero h1 {
    font-family: "Noto Serif KR", Fraunces, serif;
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.25;
    letter-spacing: -0.03em;
    font-weight: 700;
    max-width: 16em;
  }
  .lead { margin-top: 14px; max-width: 46em; color: var(--muted); }
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 22px 0 8px;
  }
  .hero-stats div, .card, .idea, .today, .dest, .prep, .phase-note {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .hero-stats div { padding: 14px 16px; }
  .hero-stats b {
    display: block;
    font-family: Fraunces, serif;
    font-size: 34px;
    font-weight: 560;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .hero-stats span, .kicker, .muted { color: var(--muted); }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .section { margin-top: 34px; }
  .section h2, .week-head h2 {
    font-family: "Noto Serif KR", serif;
    font-size: 28px;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  .today-grid, .dest-grid, .ideas, .map {
    display: grid;
    gap: 12px;
  }
  .today-grid, .dest-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ideas { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 14px 0; }
  .today, .dest, .prep { padding: 16px; }
  .today { border-top: 4px solid var(--c, var(--accent)); }
  .today h3, .dest h3 { font-size: 18px; margin: 4px 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn, .check, .tab-lite {
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    padding: 7px 12px;
  }
  .btn.primary, .check.on, .pass.on {
    background: var(--accent);
    color: #fffdf8;
    border-color: transparent;
  }
  .map { grid-template-columns: 72px repeat(3, minmax(0, 1fr)); }
  .map button, .qh {
    text-align: left;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    padding: 12px;
    min-height: 108px;
  }
  .qh {
    display: flex;
    align-items: flex-end;
    font-family: Fraunces, serif;
    background: transparent;
    box-shadow: none;
    min-height: 0;
    border: 0;
    padding: 8px;
  }
  .map button strong { display: block; }
  .map button small, .meta small { color: var(--muted); display: block; margin-top: 4px; }
  .map button em { font-style: normal; font-size: 12px; color: var(--accent); }
  .principles { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 12px; }
  .principles article, .hour {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .hour ol, .blocks { margin: 8px 0 0; padding: 0; list-style: none; }
  .hour li, .blocks li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 5px 0; }
  .min {
    font-family: Fraunces, serif;
    color: var(--accent);
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .side {
    position: sticky;
    top: 78px;
    max-height: calc(100vh - 96px);
    overflow: auto;
    padding-right: 4px;
  }
  .side details { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .side summary { cursor: pointer; font-weight: 700; }
  .weekbtns { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .wbtn {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: 8px;
    padding: 6px 8px;
  }
  .wbtn[aria-current="page"] { background: var(--accent-soft); }
  .wbtn span { color: var(--muted); font-size: 12px; }
  .search {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .week-head .goal { font-size: 18px; margin: 8px 0; }
  .meta {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin: 12px 0;
  }
  .meta div {
    background: var(--bg-2);
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
  }
  .meta b { display: block; font-size: 13px; }
  .idea { padding: 12px 14px; background: var(--accent-soft); }
  .idea b { display: block; }
  .day {
    display: grid;
    grid-template-columns: minmax(140px, 190px) minmax(0, 1fr);
    gap: 8px 16px;
    padding: 14px;
    margin-top: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .day.today { outline: 2px solid var(--accent); }
  .day h3 { font-size: 17px; }
  .when { color: var(--muted); font-size: 13px; }
  .day-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .banner {
    background: #fff6e8;
    border: 1px solid #efd3a8;
    border-radius: 12px;
    padding: 10px 12px;
    margin: 10px 0;
  }
  .index-list { display: flex; flex-direction: column; gap: 8px; }
  .index-list button {
    text-align: left;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .dock {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    z-index: 50;
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: #1c1914;
    color: #f6f1e6;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .dock[hidden] { display: none; }
  body.timing .wrap { padding-bottom: 168px; }
  .clock {
    font-family: Fraunces, serif;
    font-size: 36px;
    line-height: 1;
    min-width: 5ch;
  }
  .bar { height: 4px; background: rgba(255,255,255,.2); border-radius: 99px; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: #f3d7a1; border-radius: inherit; width: 0; }
  .dock .btn { background: transparent; color: inherit; border-color: rgba(255,255,255,.3); }
  .foot { margin-top: 28px; color: var(--muted); font-size: 13px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  @media (max-width: 900px) {
    .hero-stats, .today-grid, .dest-grid, .ideas, .meta, .principles { grid-template-columns: 1fr; }
    .map { grid-template-columns: 1fr; }
    .qh { display: none; }
    .layout { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; }
    .day { grid-template-columns: 1fr; }
    .dock { flex-direction: column; align-items: stretch; }
  }
  @media print {
    .top, .side, .dock, .day-actions, .noprint { display: none !important; }
    body { background: white; }
    .day, .idea, .meta div { break-inside: avoid; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<header class="top">
  <button class="brand" data-act="home" type="button">
    <span class="brand-kicker">52 WEEKS · 3 DOMAINS</span>
    <span class="brand-name">1년 학습 로드맵</span>
  </button>
  <nav class="tabs" id="trackNav" aria-label="도메인"></nav>
  <div class="top-tools">
    <label>시작일 <input type="date" id="startDate"></label>
    <span class="statline" id="statLine"></span>
    <details class="menu">
      <summary>기록</summary>
      <div class="menu-panel">
        <button type="button" data-act="index">개념 색인</button>
        <button type="button" data-act="export">기록 내보내기</button>
        <button type="button" data-act="import">기록 가져오기</button>
        <button type="button" data-act="reset">기록 초기화</button>
      </div>
    </details>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="dock" class="dock" hidden>
  <div>
    <div id="dockLabel"></div>
    <div class="bar" aria-hidden="true"><i id="dockBar"></i></div>
  </div>
  <div class="clock" id="dockClock">60:00</div>
  <div class="row">
    <button class="btn" type="button" data-act="timer-toggle">시작</button>
    <button class="btn" type="button" data-act="timer-next">다음 블록</button>
    <button class="btn" type="button" data-act="timer-close">닫기</button>
  </div>
</div>

<script>
const KEY = "roadmap-year-v1";
let DATA;
try {
  DATA = JSON.parse(document.getElementById("data").textContent);
} catch (err) {
  document.getElementById("app").textContent = "로드맵 데이터를 읽지 못했습니다.";
  throw err;
}

const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const state = load();

function load() {
  const fallback = { start: "2026-10-12", done: {}, pass: {}, track: "en", week: 1, view: "home" };
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fallback;
    const saved = JSON.parse(raw);
    return {
      start: saved.start || fallback.start,
      done: saved.done || {},
      pass: saved.pass || {},
      track: saved.track || "en",
      week: saved.week || 1,
      view: saved.view || "home"
    };
  } catch (err) {
    return fallback;
  }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function trackById(id) { return DATA.tracks.find((t) => t.id === id); }
function parseISO(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmt(d) {
  const z = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
}
function addDays(d, n) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function dayOffset(from, startISO) {
  const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  return Math.round((a - parseISO(startISO)) / 86400000);
}
function posFromOffset(off) {
  if (off < 0 || off >= 364) return null;
  return { week: Math.floor(off / 7) + 1, day: off % 7 };
}
function offsetToday() { return dayOffset(new Date(), state.start); }
function dateOf(week, day) { return addDays(parseISO(state.start), (week - 1) * 7 + day); }
function sessionId(track, week, day) { return track + ":" + week + ":" + day; }
function isDone(track, week, day) { return !!state.done[sessionId(track, week, day)]; }
function weekDoneCount(track, week) {
  let n = 0;
  for (let d = 0; d < 7; d++) if (isDone(track, week, d)) n++;
  return n;
}
function sessionsOnOffset(off) {
  const pos = posFromOffset(off);
  if (!pos) return 0;
  let n = 0;
  DATA.tracks.forEach((tr) => { if (isDone(tr.id, pos.week, pos.day)) n++; });
  return n;
}
function streak() {
  let off = offsetToday();
  if (off < 0) return 0;
  if (off > 363) off = 363;
  if (sessionsOnOffset(off) === 0) off -= 1;
  let s = 0;
  for (let i = off; i >= 0; i--) {
    if (sessionsOnOffset(i) > 0) s += 1;
    else break;
  }
  return s;
}
function totalDone() { return Object.keys(state.done).length; }
function writeHash() {
  const next = state.view === "home" ? "#/home" : state.view === "index" ? "#/index" : "#/" + state.track + "/" + state.week;
  if (location.hash !== next) history.replaceState(null, "", next);
}
function readHash() {
  const h = location.hash.replace(/^#\/?/, "");
  if (!h || h === "home") { state.view = "home"; return; }
  if (h === "index") { state.view = "index"; return; }
  const parts = h.split("/");
  if (trackById(parts[0])) {
    state.view = "track";
    state.track = parts[0];
    const n = Number(parts[1]);
    if (n >= 1 && n <= 52) state.week = n;
  }
}
function phaseOf(track, week) {
  return track.phases.find((p) => week >= p.start && week <= p.end);
}
function hourList(items) {
  return "<ol>" + items.map((it) => "<li><span class=\"min\">" + esc(it[0]) + "</span><span>" + esc(it[1]) + "</span></li>").join("") + "</ol>";
}

function renderNav() {
  document.getElementById("trackNav").innerHTML = DATA.tracks.map((tr) => {
    const on = state.view === "track" && state.track === tr.id;
    return "<button class=\"tab\" type=\"button\" data-act=\"track\" data-track=\"" + tr.id + "\"" + (on ? " aria-current=\"page\"" : "") + ">" + esc(tr.name) + "</button>";
  }).join("") + "<button class=\"tab\" type=\"button\" data-act=\"index\"" + (state.view === "index" ? " aria-current=\"page\"" : "") + ">개념</button>";
  document.getElementById("startDate").value = state.start;
  document.getElementById("statLine").textContent = "세션 " + totalDone() + "/1092 · 연속 " + streak() + "일";
  document.body.dataset.track = state.view === "track" ? state.track : "home";
}

function render(opts) {
  opts = opts || {};
  const y = opts.keepScroll ? window.scrollY : 0;
  const focusId = document.activeElement && document.activeElement.id;
  renderNav();
  const app = document.getElementById("app");
  if (!DATA.tracks.length) {
    app.textContent = "커리큘럼 데이터가 비어 있습니다.";
    return;
  }
  if (state.view === "home") app.innerHTML = renderHome();
  else if (state.view === "index") app.innerHTML = renderIndex();
  else app.innerHTML = renderTrack();
  if (focusId === "q" || focusId === "indexQ") {
    const el = document.getElementById(focusId);
    if (el) el.focus();
  }
  window.scrollTo(0, opts.keepScroll ? y : 0);
}

function todayCard(tr) {
  const off = offsetToday();
  if (off < 0) {
    return "<article class=\"today\" style=\"--c:" + tr.color + "\"><p class=\"kicker\">" + esc(tr.name) + "</p><h3>시작 전</h3><p>시작일 전에 아래 준비 60분을 하면 1주차 월요일이 비지 않습니다.</p></article>";
  }
  if (off >= 364) {
    return "<article class=\"today\" style=\"--c:" + tr.color + "\"><p class=\"kicker\">" + esc(tr.name) + "</p><h3>52주가 끝났습니다</h3><p>" + esc(tr.after) + "</p><div class=\"row\"><button class=\"btn\" type=\"button\" data-act=\"track\" data-track=\"" + tr.id + "\" data-week=\"52\">52주 다시 보기</button></div></article>";
  }
  const pos = posFromOffset(off);
  const week = tr.weeks[pos.week - 1];
  const day = week.days[pos.day];
  const dt = dateOf(pos.week, pos.day);
  const done = isDone(tr.id, pos.week, pos.day);
  return "<article class=\"today\" style=\"--c:" + tr.color + "\"><p class=\"kicker\">" + esc(tr.name) + " · " + pos.week + "주</p><h3>" + esc(day.title) + "</h3><p class=\"when\">" + fmt(dt) + " (" + DOW[dt.getDay()] + ") · " + (done ? "완료" : "오늘 60분") + "</p><p>" + esc(day.blocks[1] ? day.blocks[1].t : day.blocks[0].t) + "</p><div class=\"row\"><button class=\"btn primary\" type=\"button\" data-act=\"track\" data-track=\"" + tr.id + "\" data-week=\"" + pos.week + "\">계획 열기</button><button class=\"check" + (done ? " on" : "") + "\" type=\"button\" data-act=\"done\" data-id=\"" + sessionId(tr.id, pos.week, pos.day) + "\">" + (done ? "완료됨" : "완료") + "</button></div></article>";
}

function renderHome() {
  const off = offsetToday();
  const where = off < 0 ? "시작 전" : off >= 364 ? "52주 완료" : (Math.floor(off / 7) + 1) + "주차 " + (off % 7 + 1) + "일차";
  const quarters = DATA.tracks[0].phases.map((_, qi) => {
    const head = "<div class=\"qh\">" + (qi + 1) + "분기</div>";
    const cells = DATA.tracks.map((tr) => {
      const p = tr.phases[qi];
      return "<button type=\"button\" data-act=\"track\" data-track=\"" + tr.id + "\" data-week=\"" + p.start + "\"><em>" + esc(tr.name) + " · " + esc(p.from) + " → " + esc(p.to) + "</em><strong>" + esc(p.name) + "</strong><small>" + p.start + "–" + p.end + "주 · " + esc(p.result) + "</small></button>";
    }).join("");
    return head + cells;
  }).join("");
  return [
    "<section class=\"hero\">",
    "<p class=\"kicker\">오늘 위치 · " + esc(where) + "</p>",
    "<h1>하루 한 시간씩, 세 번. 기초에서 실무까지.</h1>",
    "<p class=\"lead\">영어, 알고리즘, 수학을 각각 처음 시작하는 지점부터 52주 동안 하루 60분으로 올립니다. 세 도메인을 같은 날에 하면 하루 합계는 3시간입니다. 한 도메인만 선택하면 그 트랙이 곧 하루 1시간짜리 1년 계획입니다.</p>",
    "<div class=\"hero-stats\"><div><b>364</b><span>도메인당 시간</span></div><div><b>3</b><span>병렬이면 하루 시간</span></div><div><b>52</b><span>주 · 4단계</span></div><div><b>1,092</b><span>전체 세션</span></div></div>",
    "</section>",
    "<section class=\"section\"><h2>오늘 세 세션</h2><p class=\"muted\">달력은 시작일부터 364일입니다. 이미 아는 주는 7일차 점검만 통과하면 시간을 허수로 채우지 않고 건너뛸 수 있습니다.</p><div class=\"today-grid\">" + DATA.tracks.map(todayCard).join("") + "</div></section>",
    "<section class=\"section\"><h2>1년 지도</h2><p class=\"muted\">칸을 누르면 그 단계의 첫 주로 갑니다.</p><div class=\"map\">" + quarters + "</div></section>",
    "<section class=\"section\"><h2>60분을 쓰는 방법</h2><div class=\"principles\">" + DATA.tracks.map((tr) => "<article class=\"hour\"><p class=\"kicker\" style=\"color:" + tr.color + "\">" + esc(tr.name) + "</p><h3>" + esc(tr.hourTitle) + "</h3>" + hourList(tr.hour) + "</article>").join("") + "</div></section>",
    "<section class=\"section prep\"><h2>시작 전 60분</h2><p>노트 세 칸(영어·알고리즘·수학)과 녹음 앱을 준비합니다. 계산기, 파이썬, Anki는 1주차 지시가 나오기 전에 미리 깔아 두지 않아도 됩니다. 매일 같은 시각에 영어 60분, 수학 60분, 알고리즘 60분 순으로 캘린더에 넣고, 세션 사이에 10분 쉽니다. 말이 나오는 시간을 영어에 두는 편이 좋습니다.</p></section>",
    "<section class=\"section\"><h2>52주 뒤의 정의</h2><div class=\"dest-grid\">" + DATA.tracks.map((tr) => "<article class=\"dest\"><p class=\"kicker\" style=\"color:" + tr.color + "\">" + esc(tr.name) + "</p><h3>" + esc(tr.destination) + "</h3><p>" + esc(tr.limit) + "</p><p style=\"margin-top:8px\"><b>이후.</b> " + esc(tr.after) + "</p></article>").join("") + "</div></section>",
    "<section class=\"section\"><h2>공통 규칙</h2><div class=\"principles\"><article><h3>통과해야 다음 주다</h3><p>7일차는 새 개념 없이 그 주 산출물을 시험합니다. 통과 기준을 말로 충족하면 통과로 표시합니다. 실패하면 같은 주를 한 번 더 하고, 달력만 넘기지 않습니다.</p></article><article><h3>산출이 있어야 진도다</h3><p>영상을 보는 것으로 60분을 채우지 않습니다. 영어는 녹음, 알고리즘은 코드, 수학은 손으로 푼 문제가 남아야 그 세션입니다.</p></article><article><h3>기록은 이 브라우저에</h3><p>완료와 통과는 이 기기의 브라우저에 저장됩니다. 컴퓨터를 바꾸기 전에 기록 메뉴에서 내보내 두십시오.</p></article></div></section>",
    "<p class=\"foot\">이 로드맵은 학습 계획입니다. 계약 영어는 문장을 읽고 고치는 언어 훈련이며 법률 자문이 아닙니다. 교재명은 그 책을 사야 한다는 뜻이 아니라, 그 주에 펼칠 출처입니다. 무료 자료를 우선 적었습니다.</p>"
  ].join("");
}

function weekListHTML(tr) {
  const q = (state.q || "").trim().toLowerCase();
  const phases = tr.phases.map((p) => {
    const buttons = [];
    for (let w = p.start; w <= p.end; w++) {
      const week = tr.weeks[w - 1];
      const blob = (week.title + " " + week.goal + " " + week.ideas.map((i) => i[0] + " " + i[1]).join(" ") + " " + week.days.map((d) => d.title).join(" ")).toLowerCase();
      if (q && blob.indexOf(q) === -1) continue;
      const on = w === state.week;
      buttons.push("<button class=\"wbtn\" type=\"button\" data-act=\"week\" data-week=\"" + w + "\"" + (on ? " aria-current=\"page\"" : "") + ">" + w + ". " + esc(week.title) + "<span>" + weekDoneCount(tr.id, w) + "/7</span></button>");
    }
    if (!buttons.length) return "";
    const open = q || (state.week >= p.start && state.week <= p.end);
    return "<details" + (open ? " open" : "") + "><summary>" + esc(p.name) + " · " + p.start + "–" + p.end + "주</summary><div class=\"weekbtns\">" + buttons.join("") + "</div></details>";
  }).join("");
  return phases || "<p class=\"muted\">맞는 주가 없습니다.</p>";
}

function renderTrack() {
  const tr = trackById(state.track);
  const week = tr.weeks[state.week - 1];
  const phase = phaseOf(tr, state.week);
  const off = offsetToday();
  const todayPos = posFromOffset(off);
  const warn = state.week > 1 && !state.pass[tr.id + ":" + (state.week - 1)];
  const days = week.days.map((day, i) => {
    const dt = dateOf(state.week, i);
    const today = todayPos && todayPos.week === state.week && todayPos.day === i;
    const done = isDone(tr.id, state.week, i);
    const id = sessionId(tr.id, state.week, i);
    return "<article class=\"day" + (today ? " today" : "") + "\"><div><p class=\"when\">" + (i + 1) + "일차 · " + fmt(dt) + " " + DOW[dt.getDay()] + (today ? " · 오늘" : "") + (i === 6 ? " · 점검" : "") + "</p><h3>" + esc(day.title) + "</h3><div class=\"day-actions\"><button class=\"check" + (done ? " on" : "") + "\" type=\"button\" data-act=\"done\" data-id=\"" + id + "\">" + (done ? "완료됨" : "60분 완료") + "</button><button class=\"btn\" type=\"button\" data-act=\"timer\" data-track=\"" + tr.id + "\" data-week=\"" + state.week + "\" data-day=\"" + i + "\">타이머</button></div></div><ol class=\"blocks\">" + day.blocks.map((b) => "<li><span class=\"min\">" + b.m + "분</span><span>" + esc(b.t) + "</span></li>").join("") + "</ol></article>";
  }).join("");
  const passed = !!state.pass[tr.id + ":" + state.week];
  return [
    "<div class=\"layout\">",
    "<aside class=\"side noprint\"><input class=\"search\" id=\"q\" placeholder=\"개념, 주 제목 검색\" value=\"" + esc(state.q || "") + "\"><div id=\"weekList\">" + weekListHTML(tr) + "</div></aside>",
    "<section id=\"week\">",
    "<p class=\"kicker\">" + esc(phase.name) + " · " + esc(phase.from) + " → " + esc(phase.to) + "</p>",
    "<div class=\"week-head\"><h2><span class=\"min\">" + String(state.week).padStart(2, "0") + "</span> " + esc(week.title) + "</h2><p class=\"goal\">" + esc(week.goal) + "</p></div>",
    warn ? "<div class=\"banner\">이전 주 통과 표시가 없습니다. 지난주 산출물을 아직 설명하지 못했다면 이번 주 새 개념보다 이전 주 7일차를 먼저 하는 편이 구멍이 적습니다.</div>" : "",
    "<div class=\"ideas\">" + week.ideas.map((idea) => "<article class=\"idea\"><b>" + esc(idea[0]) + "</b>" + esc(idea[1]) + "</article>").join("") + "</div>",
    "<div class=\"meta\"><div><b>이번 주 산출물</b><small>" + esc(week.outcome) + "</small></div><div><b>펼칠 자료</b><small>" + esc(week.resource) + "</small></div><div><b>통과 기준</b><small>" + esc(week.check) + "</small></div></div>",
    "<div class=\"row noprint\"><button class=\"pass" + (passed ? " on" : "") + " btn\" type=\"button\" data-act=\"pass\" data-id=\"" + tr.id + ":" + state.week + "\">" + (passed ? "통과함" : "이 주 통과") + "</button><button class=\"btn\" type=\"button\" data-act=\"jump\" data-week=\"" + Math.max(1, state.week - 1) + "\">이전 주</button><button class=\"btn\" type=\"button\" data-act=\"jump\" data-week=\"" + Math.min(52, state.week + 1) + "\">다음 주</button><button class=\"btn\" type=\"button\" data-act=\"today-jump\">오늘 주로</button></div>",
    days,
    "<p class=\"foot\">" + esc(tr.name) + " 단계 결과: " + esc(phase.result) + "</p>",
    "</section></div>"
  ].join("");
}

function renderIndex() {
  const q = (state.iq || "").trim().toLowerCase();
  const rows = [];
  DATA.tracks.forEach((tr) => {
    tr.weeks.forEach((week, wi) => {
      week.ideas.forEach((idea) => {
        const blob = (tr.name + " " + week.title + " " + idea[0] + " " + idea[1]).toLowerCase();
        if (q && blob.indexOf(q) === -1) return;
        rows.push("<button type=\"button\" data-act=\"track\" data-track=\"" + tr.id + "\" data-week=\"" + (wi + 1) + "\"><small>" + esc(tr.name) + " · " + (wi + 1) + "주 " + esc(week.title) + "</small><br><b>" + esc(idea[0]) + "</b> " + esc(idea[1]) + "</button>");
      });
    });
  });
  return "<section><p class=\"kicker\">개념 색인</p><h2>1년에 만나는 개념</h2><p class=\"muted\">용어를 누르면 그 주로 이동합니다. " + rows.length + "개.</p><input class=\"search\" id=\"indexQ\" placeholder=\"용어 검색\" value=\"" + esc(state.iq || "") + "\"><div class=\"index-list\">" + rows.join("") + "</div></section>";
}

const timer = { running: false, left: 0, blocks: [], index: 0, handle: 0, endAt: 0, label: "" };
function showDock() {
  const dock = document.getElementById("dock");
  const block = timer.blocks[timer.index];
  if (!block) { dock.hidden = true; document.body.classList.remove("timing"); return; }
  dock.hidden = false;
  document.body.classList.add("timing");
  const total = timer.blocks.reduce((a, b) => a + b.m, 0) * 60;
  const spent = timer.blocks.slice(0, timer.index).reduce((a, b) => a + b.m, 0) * 60 + (block.m * 60 - timer.left);
  document.getElementById("dockLabel").textContent = timer.label + " · " + block.m + "분 · " + block.t;
  const sec = Math.ceil(timer.left);
  document.getElementById("dockClock").textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  document.getElementById("dockBar").style.width = Math.min(100, (spent / total) * 100) + "%";
  document.querySelector("[data-act='timer-toggle']").textContent = timer.running ? "일시정지" : "시작";
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = 640;
    o.connect(g);
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.04, ctx.currentTime);
    o.start();
    o.stop(ctx.currentTime + 0.12);
  } catch (err) { /* 소리 없음 */ }
}
function tick() {
  if (!timer.running) return;
  timer.left = Math.max(0, (timer.endAt - Date.now()) / 1000);
  if (timer.left <= 0) {
    beep();
    if (timer.index < timer.blocks.length - 1) {
      timer.index += 1;
      timer.left = timer.blocks[timer.index].m * 60;
      timer.endAt = Date.now() + timer.left * 1000;
    } else {
      timer.running = false;
      timer.left = 0;
      clearInterval(timer.handle);
    }
  }
  showDock();
}
function startTimer(tr, week, day) {
  const d = tr.weeks[week - 1].days[day];
  timer.blocks = d.blocks;
  timer.index = 0;
  timer.left = d.blocks[0].m * 60;
  timer.running = false;
  timer.label = tr.name + " " + week + "주 · " + d.title;
  clearInterval(timer.handle);
  showDock();
}

document.body.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "home") {
    state.view = "home";
    writeHash();
    save();
    render();
  } else if (act === "index") {
    state.view = "index";
    writeHash();
    save();
    render();
    document.querySelector(".menu").open = false;
  } else if (act === "track") {
    state.view = "track";
    state.track = t.dataset.track;
    if (t.dataset.week) state.week = Number(t.dataset.week);
    writeHash();
    save();
    render();
  } else if (act === "week" || act === "jump") {
    state.week = Number(t.dataset.week);
    writeHash();
    save();
    render();
  } else if (act === "today-jump") {
    const pos = posFromOffset(offsetToday());
    if (pos) state.week = pos.week;
    writeHash();
    save();
    render();
  } else if (act === "done") {
    if (state.done[t.dataset.id]) delete state.done[t.dataset.id];
    else state.done[t.dataset.id] = fmt(new Date());
    save();
    render({ keepScroll: true });
  } else if (act === "pass") {
    if (state.pass[t.dataset.id]) delete state.pass[t.dataset.id];
    else state.pass[t.dataset.id] = fmt(new Date());
    save();
    render({ keepScroll: true });
  } else if (act === "timer") {
    startTimer(trackById(t.dataset.track), Number(t.dataset.week), Number(t.dataset.day));
  } else if (act === "timer-toggle") {
    if (!timer.blocks.length) return;
    timer.running = !timer.running;
    if (timer.running) {
      timer.endAt = Date.now() + timer.left * 1000;
      clearInterval(timer.handle);
      timer.handle = setInterval(tick, 250);
    } else clearInterval(timer.handle);
    showDock();
  } else if (act === "timer-next") {
    if (timer.index < timer.blocks.length - 1) {
      timer.index += 1;
      timer.left = timer.blocks[timer.index].m * 60;
      if (timer.running) timer.endAt = Date.now() + timer.left * 1000;
      showDock();
    }
  } else if (act === "timer-close") {
    timer.running = false;
    clearInterval(timer.handle);
    timer.blocks = [];
    document.getElementById("dock").hidden = true;
    document.body.classList.remove("timing");
  } else if (act === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "roadmap-progress.json";
    a.click();
    URL.revokeObjectURL(a.href);
  } else if (act === "import") {
    document.getElementById("importFile").click();
  } else if (act === "reset") {
    if (confirm("이 브라우저의 완료 기록과 시작일을 지울까요?")) {
      localStorage.removeItem(KEY);
      location.hash = "#/home";
      location.reload();
    }
  }
});

document.body.addEventListener("input", (e) => {
  if (e.target.id === "q") {
    state.q = e.target.value;
    const list = document.getElementById("weekList");
    if (list) list.innerHTML = weekListHTML(trackById(state.track));
  } else if (e.target.id === "indexQ") {
    state.iq = e.target.value;
    render({ keepScroll: true });
    const el = document.getElementById("indexQ");
    if (el) {
      el.focus();
      const n = el.value.length;
      el.setSelectionRange(n, n);
    }
  }
});
document.getElementById("startDate").addEventListener("change", (e) => {
  if (!e.target.value) return;
  state.start = e.target.value;
  save();
  render({ keepScroll: true });
});
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== "object") throw new Error("형식");
      state.start = data.start || state.start;
      state.done = data.done || {};
      state.pass = data.pass || {};
      save();
      render();
    } catch (err) {
      alert("가져올 수 없는 파일입니다.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea") || state.view !== "track") return;
  if (e.key === "[") { state.week = Math.max(1, state.week - 1); writeHash(); save(); render(); }
  if (e.key === "]") { state.week = Math.min(52, state.week + 1); writeHash(); save(); render(); }
});
window.addEventListener("hashchange", () => { readHash(); render(); });

function validateRoadmap() {
  const errors = [];
  if (!DATA.tracks || DATA.tracks.length !== 3) errors.push("tracks");
  DATA.tracks.forEach((tr) => {
    if (tr.weeks.length !== 52) errors.push(tr.id + " weeks " + tr.weeks.length);
    tr.weeks.forEach((w, i) => {
      if (!w.days || w.days.length !== 7) errors.push(tr.id + " w" + (i + 1) + " days");
      if (!w.ideas || w.ideas.length < 3) errors.push(tr.id + " w" + (i + 1) + " ideas");
      (w.days || []).forEach((d) => {
        const sum = (d.blocks || []).reduce((a, b) => a + b.m, 0);
        if (sum !== 60) errors.push(tr.id + " w" + (i + 1) + " " + d.title + " " + sum);
      });
    });
  });
  return errors;
}
window.validateRoadmap = validateRoadmap;

if (location.hash) readHash();
else writeHash();
render();
</script>
</body>
</html>
